# https://www.nginx.com/resources/wiki/start/
# https://www.nginx.com/resources/wiki/start/topics/tutorials/config_pitfalls/
# https://wiki.debian.org/Nginx/DirectoryStructure

server {
        # do we need this to be the default here? It's in isolation, hmm
        listen 80 default_server;
        listen [::]:80 default_server;

        # what should the server name be? just gtweb.uit.no, since that's
        # where we will host it?
        server_name _;

        root /var/www/korp-frontend;
        index index.html;

        location / {
                try_files $uri $uri/ =404;
        }
}

